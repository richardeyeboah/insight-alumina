# Apply together with docker-compose.yml; only Caddy publishes public ports.
services:
  db:
    restart: unless-stopped
  migrate:
    restart: "no"
  api:
    restart: unless-stopped
    ports: !reset []
    environment:
      APP_ENV: production
      APP_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
  worker:
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_CAL_BOOKING_URL: https://cal.com/insight-alumina/
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
volumes:
  caddy_data:
  caddy_config:
